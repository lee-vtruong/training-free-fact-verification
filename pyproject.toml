[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-free-fact-verification"
version = "0.1.0"
description = "Source-only historical error audits for frozen fact verifiers"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.24,<3"]
retrieval = ["numpy>=1.24,<3", "torch>=2.2,<3", "transformers>=4.51,<5"]

[project.scripts]
tffv-audit = "tffv.experiments.audit:main"
tffv-retrieval = "tffv.retrieval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
